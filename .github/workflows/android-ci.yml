name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build, Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: Run physics, launch & local unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests '*TowerPhysicsEngineTest*' \
            --tests '*MainActivityLaunchTest*' \
            --tests '*ExampleRobolectricTest*' \
            --tests '*ExampleUnitTest*' \
            --no-daemon

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tumble-tower-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  firebase_rules_test:
    name: Firestore Rules & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Install Firebase CLI and rules test SDK
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing

      - name: Run Firestore Rules & Robolectric RuleTests in Emulator
        run: |
          npx firebase emulators:exec --only firestore,auth --project demo-no-project \
            'FIRESTORE_EMULATOR_HOST="127.0.0.1:8085" node --test firestore.test.js && gradle :app:testDebugUnitTest --tests "*FirebaseSyncRepositoryRuleTest*" --no-daemon'
